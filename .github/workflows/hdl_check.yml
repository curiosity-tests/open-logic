name: HDL-Check
run-name: "HDL-Check ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# Set the permissions for the workflow
permissions:
  id-token: write
  checks: write
  pull-requests: write

#Set Triggers
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
#Jobs  
jobs:
  simulation-ghdl:
    runs-on: ubuntu-latest
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v5
      - name: Checkout repo
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          submodules: true
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Run Simulation
      - name: Run Simulation
        uses: ./.github/actions/simulation
        with:
          os: ${{ runner.os }}
          simulator: ghdl

  simulation-nvc:
    runs-on: ubuntu-latest
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v5
      - name: Checkout repo
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          submodules: true
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Run Simulation
      - name: Run Simulation
        uses: ./.github/actions/simulation
        with:
          os: ${{ runner.os }}
          simulator: nvc

  linting:
    runs-on: ubuntu-latest
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v5
      - name: Checkout repo
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Run Linting
      - name: Run Linting
        shell: bash
        run: |
          cd ./lint/script
          python3 script.py
      #Upload Linting results
      - name: Upload Linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-artifacts
          path: |
            lint/report/vsg_normal_vhdl.xml 
            lint/report/vsg_vc_vhdl.xml

  check-synthesis-config:
    runs-on: ubuntu-latest
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v5
      - name: Checkout repo
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Run Synthesis Config Check
      - name: base
        run: |
          cd ./tools/inference_test
          python3 -u ./InferenceTest.py --yml=./yaml/base.yml --no-tables --check-coverage --dry-run
      - name: axi
        run: |
          cd ./tools/inference_test
          python3 -u ./InferenceTest.py --yml=./yaml/axi.yml --no-tables --check-coverage --dry-run
      - name: intf 
        run: |
          cd ./tools/inference_test
          python3 -u ./InferenceTest.py --yml=./yaml/intf.yml --no-tables --check-coverage --dry-run
      - name: fix
        run: |
          cd ./tools/inference_test
          python3 -u ./InferenceTest.py --yml=./yaml/fix.yml --no-tables --check-coverage --dry-run
      
      
